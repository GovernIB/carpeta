# Directori on es guardaran tots els fitxers de Carpeta
es.caib.carpeta.filesdirectory=C:\\carpeta-files

#  Tipus de FileSystemManager
es.caib.carpeta.filesystemmanagerclass=org.fundaciobit.genapp.common.filesystem.SimpleFileSystemManager
#  Si volem distribuir els fitxers en directoris, llavors utilitzar aquesta classe.
#  Revisar punt "Migracio de 1.1.4 a 2.0.0 del 'Manual de Migracions'
#es.caib.carpeta.filesystemmanagerclass=org.fundaciobit.genapp.common.filesystem.ThreeFolderFileSystemManager

#  ======== PLUGIN USER-INFORMATION - KEYCLOAK =======

es.caib.carpeta.userinformationplugin=org.fundaciobit.pluginsib.userinformation.keycloak.KeyCloakUserInformationPlugin
es.caib.carpeta.pluginsib.userinformation.keycloak.serverurl=http://localhost:18080/auth/
es.caib.carpeta.pluginsib.userinformation.keycloak.realm=GOIB
es.caib.carpeta.pluginsib.userinformation.keycloak.client_id=goib-ws
es.caib.carpeta.pluginsib.userinformation.keycloak.password_secret=[=SP["es.caib.carpeta.pluginsib.userinformation.keycloak.password_secret"]]
es.caib.carpeta.pluginsib.userinformation.keycloak.client_id_for_user_autentication=goib-default

# Mappings. Mapejos entre valors de Attibutes de un usuari i els valors de UserInfo de PluginUserInformation
# Clau:  username, administrationID, name, surname1, surname2, email, language,
#        phoneNumber, password,  address, company, website o gender( -1: unknown or undefined, 0 female, 1 male)
# Valor:  Atribut definit dins "Attributes" de l'usuari Keycloak
org.fundaciobit.sample.pluginsib.userinformation.keycloak.mapping.administrationID=nif

#org.fundaciobit.sample.pluginsib.userinformation.keycloak.mapping.company=departmentNumber
#org.fundaciobit.sample.pluginsib.userinformation.keycloak.mapping.surname1=sn1
#org.fundaciobit.sample.pluginsib.userinformation.keycloak.mapping.surname2=sn2
# Per depuració
es.caib.carpeta.pluginsib.userinformation.keycloak.debug=true


