          enum:
          - NACIONAL
          - ESTRANGER
          - APARTAT_CORREUS
          - SENSE_NORMALITZAR
          example: NACIONAL
          type: string
        viaTipus:
          description: |-
            Enumerat que indica el tipus de via per a entregues postals
             * Obligatori quan tipoDomicili = NACIONAL
          enum:
          - ALAMEDA
          - CALLE
          - CAMINO
          - CARRER
          - CARRETERA
          - GLORIETA
          - KALEA
          - PASAJE
          - PASEO
          - PLAÇA
          - PLAZA
          - RAMBLA
          - RONDA
          - RUA
          - SECTOR
          - TRAVESIA
          - URBANIZACION
          - AVENIDA
          - AVINGUDA
          - BARRIO
          - CALLEJA
          - CAMI
          - CAMPO
          - CARRERA
          - CUESTA
          - EDIFICIO
          - ENPARANTZA
          - ESTRADA
          - JARDINES
          - JARDINS
          - PARQUE
          - PASSEIG
          - PRAZA
          - PLAZUELA
          - PLACETA
          - POBLADO
          - VIA
          - TRAVESSERA
          - PASSATGE
          - BULEVAR
          - POLIGONO
          - OTROS
          example: CARRER
          type: string
        viaNom:
          description: |-
            Nom de la via per entregues postals
             * Obligatori quan tipoDomicili = NACIONAL o ESTRANGER
          example: Aragó
          maxLength: 50
          minLength: 0
          type: string
        numeroCasa:
          description: |-
            Número de la casa per entregues postals
             * Obligatori quan tipoDomicili = NACIONAL excepte si s’indica el punt quilomètric
          example: "26"
          maxLength: 5
          minLength: 0
          type: string
        numeroQualificador:
          description: Informació addicional sobre la numeració de l’adreça
          example: bis
          maxLength: 3
          minLength: 0
          type: string
        puntKm:
          description: |-
            Punt quilomètric per entregues postals
             * Obligatori quan tipoDomicili = NACIONAL excepte si s’indica numeroCasa
          example: "12.5"
          maxLength: 30
          minLength: 0
          type: string
        apartatCorreus:
          description: |-
            Apartat de correus per entregues postals
             * Obligatori quan tipoDomicili = APARTAT_CORREUS
          example: "123"
          maxLength: 10
          minLength: 0
          type: string
        portal:
          description: Portal de la casa per entregues postals
          example: "2"
          maxLength: 3
          minLength: 0
          type: string
        escala:
          description: Escala de la casa per entregues postals
          example: B
          maxLength: 3
          minLength: 0
          type: string
        planta:
          description: Planta de la casa per entregues postals
          example: "4"
          maxLength: 3
          minLength: 0
          type: string
        porta:
          description: Porta de la casa per entregues postals
          example: "2"
          maxLength: 3
          minLength: 0
          type: string
        bloc:
          description: Bloc de la casa per entregues postals
          example: C
          maxLength: 3
          minLength: 0
          type: string
        complement:
          description: Informació extra sobre la casa per entregues postals
          example: Edificio Walden
          maxLength: 40
          minLength: 0
          type: string
        codiPostal:
          description: |-
            Codi postal de la casa per entregues postals.
             * Per enviaments internacionals a països sense codi posatal es pot posar 00000.
          example: "07003"
          maxLength: 10
          minLength: 0
          type: string
        poblacio:
          description: |-
            Població on s’entrega l’enviament
             * Obligatori quan tipoDomicili = NACIONAL, ESTRANGER o APARTAT_POSTAL
          example: Palma
          maxLength: 255
          minLength: 0
          type: string
        municipiCodi:
          description: |-
            Codi INE de 6 caràcters del municipi on s’entrega l’enviament (inclou codi de control)
             * Obligatori quan tipoDomicili = NACIONAL o APARTAT_POSTAL
          example: "070407"
          maxLength: 6
          minLength: 0
          type: string
        provincia:
          description: |-
            Codi INE de 2 dígits de la província on s’entrega l’enviament
             * Obligatori quan tipoDomicili = NACIONAL o APARTAT_POSTAL
          example: "07"
          maxLength: 2
          minLength: 0
          type: string
        paisCodi:
          description: |-
            Codi ISO 3166 de 2 caràcters del país on s’entrega l’enviament
            * Obligatori quan tipoDomicili = ESTRANGER
          example: DE
          maxLength: 2
          minLength: 0
          type: string
        linea1:
          description: |-
            Línia 1 de l’adreça d’entrega de l’enviament sense normalitzar
             * Obligatori quan tipoDomicili = SENSE_NORMALITZAR
          example: "Carrer Aragó 26bis, 4t - 3"
          maxLength: 50
          minLength: 0
          type: string
        linea2:
          description: |-
            Línia 2 de l’adreça d’entrega de l’enviament sense normalitzar
             * Obligatori quan tipoDomicili = SENSE_NORMALITZAR
          example: Palma 07003 - Illes Balears
          maxLength: 50
          minLength: 0
          type: string
        cie:
          description: Línia 2 de l’adreça d’entrega de l’enviament sense normalitzar
          example: Servera
          type: string
        formatSobre:
          description: 'Cadena indicant el format del sobre '
          example: C5
          maxLength: 10
          minLength: 0
          type: string
        formatFulla:
          description: Cadena indicant el format de la fulla
          example: A4
          maxLength: 10
          minLength: 0
          type: string
      required:
      - codiPostal
      - tipus
      type: object
