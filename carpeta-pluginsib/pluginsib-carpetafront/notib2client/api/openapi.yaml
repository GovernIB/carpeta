          - ORDRE_DIA
          - INFORME_PONENCIA
          - DICTAMEN_COMISSIO
          - INICIATIVA_LEGISLATIVA
          - PREGUNTA
          - INTERPELACIO
          - RESPOSTA
          - PROPOSICIO_NO_LLEI
          - ESQUEMA
          - PROPOSTA_RESOLUCIO
          - COMPAREIXENSA
          - SOLICITUD_INFORMACIO
          - ESCRIT
          - INICIATIVA_LEGISLATIVA2
          - PETICIO
          example: INFORME
          type: string
        validesa:
          default: ORIGINAL
          description: Enumerat que indica la validesa del document * No s’utilitza
            en el cas de documents passats com a csv o uuid
          enum:
