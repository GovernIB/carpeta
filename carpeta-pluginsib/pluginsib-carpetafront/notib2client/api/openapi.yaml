components:
  schemas:
    PermisConsulta:
      description: Objecte amb les dades necessàries per donar el permís
      example:
        usuariCodi: u000000
        codiDir3Entitat: A04003003
        permisConsulta: true
        procedimentCodi: "666666"
      properties:
        codiDir3Entitat:
          description: Codi dir3 de l'entitat en la que es vol donar permís de consulta
          example: A04003003
          type: string
        permisConsulta:
          description: Indica si es vol donar o treure el permís de consulta
          example: true
          type: boolean
        procedimentCodi:
          description: Codi SIA del procediment sobre el que es vol donar permís de
            consulta
          example: "666666"
          type: string
        usuariCodi:
          description: Codi de l'usuari al que es vol donar permís de consulta
          example: u000000
          type: string
      type: object
    DadesConsulta:
      description: Objecte amb les dades necessàries per consultar les dades de registre
        d'una notificació o enviament
      example:
        ambJustificant: "true"
        referencia: 00000000-0000-0000-0000-000000000000
        identificador: 00000000-0000-0000-0000-000000000000
      properties:
        identificador:
          description: |-
            Identificador únic de la notificació a consultar
             * Camp mantingut únicament per compatibilitat amb versions antigues
             * S'ha d'indicar un idientificador o una referència. En cas d'informar ambdós, només es tindrà en compte l'identificador. Es recomana cercar sempre per referència
          example: 00000000-0000-0000-0000-000000000000
          type: string
        referencia:
          description: |-
            Referència (identificador) única de l'enviament que es vol consultar
             * S'ha d'indicar un idientificador o una referència. En cas d'informar ambdós, només es tindrà en compte l'identificador.
             * Es recomana cercar sempre per referència
          example: 00000000-0000-0000-0000-000000000000
          type: string
        ambJustificant:
          description: Indica si a la resposta s'ha d'incloure el justificant de registre
          example: "true"
          type: string
      type: object
