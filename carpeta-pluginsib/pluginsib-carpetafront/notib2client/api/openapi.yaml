        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "400":
          description: Bad Request
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaConsultaV2'
          description: Notificacions/Comunicacions per titular
      summary: Consulta totes les notificacions pendents (no llegides) d'un titular
        donat el seu dni
      tags:
      - Consulta v2
      x-accepts: application/json
  /consulta/v2/notificacions/{dniTitular}/llegides:
