openapi: 3.0.1
info:
  contact:
    email: limit@limit.es
    name: Limit Tecnologies
    url: http://limit.es
  description: API Interna de NOTIB
  title: API Interna NOTIB
  version: v2.0
servers:
- description: Servidor per defecte
  url: /notibapi/interna
- description: Servidor de l'entorn de PROVES
  url: https://proves.caib.es/notibapi/interna
security:
- basic: []
tags:
- description: API de consulta v2
  name: Consulta v2
- description: API de notificació v2
  name: Notificacio v2
- description: API de informació de Notib
  name: Informació Notib
paths:
  /notificacio/v2/permisConsulta:
    post:
      description: Aquest mètode permet donar el permís de consulta a un usuari específic
      operationId: donarPermisConsultaV2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermisConsulta'
        required: true
      responses:
        "400":
          description: Bad Request
        "200":
          content:
            application/json:
              schema:
                type: string
          description: Permisos assignats
        "201":
          content:
            application/json:
              schema:
                type: string
          description: Created
      summary: Donar permis de consulta a un usuari sobre un procediment
      tags:
      - Notificacio v2
      x-content-type: application/json
      x-accepts: application/json
  /notificacio/v2/consultaDadesRegistre:
    post:
      description: Retorna la informació del registre i el justificant d'una notificació
        dins Notib.
      operationId: consultaDadesRegistre
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DadesConsulta'
        required: true
      responses:
        "400":
          description: Bad Request
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaConsultaDadesRegistreV2'
          description: Consulta realitzada correctament
      summary: Genera el justificant i consulta la informació del registre d'una notificació.
      tags:
      - Notificacio v2
      x-content-type: application/json
      x-accepts: application/json
  /notificacio/v2/alta:
    post:
      description: Retorna una llista amb els codis dels enviaments creats per poder
        consultar el seu estat posteriorment
      operationId: alta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificacioV2'
        required: true
      responses:
        "400":
          description: Bad Request
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaAltaV2'
          description: Alta de notificació
      summary: Registra i envia la notificació a Notific@.
      tags:
      - Notificacio v2
      x-content-type: application/json
      x-accepts: application/json
  /notificacio/v2/consultaJustificantNotificacio/**:
    get:
      description: Retorna el document PDF amb el justificant de l'enviament de la
        notificació
      operationId: consultaJustificantV2
      parameters:
      - description: "Identificador de la notificació a consultar. \n * A la url del\
          \ mètode es mostra aquest identificador com a '**' degut a que per compatibilitat\
          \ amb versions antigues, es poden trobar identificadors que contenen el\
          \ caràcter '/'. \n * Actualment els identificadors tenen el format de UUID"
        example: 00000000-0000-0000-0000-000000000000
        explode: true
        in: query
        name: identificador
        required: true
        schema:
          type: string
        style: form
      responses:
        "400":
          description: Bad Request
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaConsultaJustificantEnviament'
          description: Consulta realitzada correctament
      summary: Consulta el justificant de l'enviament d'una notificació
      tags:
      - Notificacio v2
      x-accepts: application/json
  /notificacio/v2/consultaEstatNotificacio/**:
    get:
      description: Retorna la informació sobre l'estat de l'enviament dins Notib o
        Notific@
      operationId: consultaEstatNotificacio
      parameters:
      - description: "Identificador de la notificació a consultar. \n * A la url del\
          \ mètode es mostra aquest identificador com a '**' degut a que per compatibilitat\
          \ amb versions antigues, es poden trobar identificadors que contenen el\
          \ caràcter '/'. \n * Actualment els identificadors tenen el format de UUID"
        example: 00000000-0000-0000-0000-000000000000
        explode: true
        in: query
        name: identificador
        required: true
        schema:
          type: string
        style: form
      responses:
        "400":
          description: Bad Request
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaConsultaEstatNotificacioV2'
          description: Consulta realitzada correctament
      summary: Consulta de la informació d'una notificació
      tags:
      - Notificacio v2
      x-accepts: application/json
  /notificacio/v2/consultaEstatEnviament/**:
    get:
      description: Retorna la informació sobre l'estat de l'enviament dins Notific@.
      operationId: consultaEstatEnviament
      parameters:
      - description: "Referència de la notificació a consultar. \n * A la url del\
          \ mètode es mostra aquesta referència com a '**' degut a que per compatibilitat\
          \ amb versions antigues, es poden trobar referències que contenen el carà\
          cter '/'. \n * Actualment les referències tenen el format de UUID"
        example: 00000000-0000-0000-0000-000000000000
        explode: true
        in: query
        name: referencia
        required: true
        schema:
          type: string
        style: form
      responses:
        "400":
          description: Bad Request
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaConsultaEstatEnviamentV2'
          description: Consulta realitzada correctament
      summary: Consulta la informació de l'estat d'un enviament dins Notific@
      tags:
      - Notificacio v2
      x-accepts: application/json
  /consulta/v2/notificacions/{dniTitular}:
    get:
      description: "Retorna informació de totes les notificacions d'un titular, i\
        \ el seu estat"
      operationId: notificacionsByTitular
      parameters:
      - description: DNI del titular de les comunicacions a consultar
        explode: false
        in: path
        name: dniTitular
        required: true
        schema:
          type: string
        style: simple
      - content:
          '*/*':
            schema:
              format: date
              type: string
        description: Data inicial d'enviament a consultar
        in: query
        name: dataInicial
        required: false
      - content:
          '*/*':
            schema:
              format: date
              type: string
        description: Datfa final d'enviament a consultar
        in: query
        name: dataFinal
        required: false
      - content:
          '*/*':
            schema:
              type: boolean
        description: "Filtrar per visible a carpeta. Si s'indica el valor si, nomé\
          s es retornaran enviaments amb estats visibles per la carpeta. Si s'indica\
          \ el valor no, es retornaran tots els enviaments independentment de si els\
          \ seus estats son visible o no a la carpeta."
        in: query
        name: visibleCarpeta
        required: false
      - content:
          '*/*':
            schema:
              enum:
              - CA
              - ES
              type: string
        description: Idioma de les descripcions
        in: query
        name: lang
        required: false
      - description: Número de pàgina a mostrar en la paginació
        explode: true
        in: query
        name: pagina
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: Mida de la pàgina a mostrar en la paginació
        explode: true
        in: query
        name: mida
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "400":
          description: Bad Request
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaConsultaV2'
          description: Notificacions/Comunicacions per titular
      summary: Consulta totes les notificacions d'un titular donat el seu dni
      tags:
      - Consulta v2
      x-accepts: application/json
  /consulta/v2/notificacions/{dniTitular}/pendents:
