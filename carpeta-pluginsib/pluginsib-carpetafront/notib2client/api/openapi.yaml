    EntregaPostal:
      description: |-
        Objecte amb les dades necessàries per a realitzar una entrega postal
         * Obligatori únicament en cas d'indicar que es realitza entrega postal(Consultar prèviament si està disponible l'entrega postal a l'òrgan gestor emissor)
      example:
        poblacio: Palma
        municipiCodi: "070407"
        linea1: "Carrer Aragó 26bis, 4t - 3"
        linea2: Palma 07003 - Illes Balears
        formatSobre: C5
