        numeroFormatat:
          description: Número de registre amb format
          example: GOIBS1753/2023
          type: string
        dataRegistre:
          description: Data del registre
          example: 1706168093962
          format: int64
          type: integer
        justificant:
          description: Contingut del fitxer justificant
