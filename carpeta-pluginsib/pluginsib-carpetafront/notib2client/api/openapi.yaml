      description: Representants a qui enviar l'enviament
      example:
        raoSocial: Amazon ltd.
        llinatge2: Servera
        incapacitat: false
        llinatge1: Riera
        telefon: "678123456"
        nif: 00000000T
        interessatTipus: FISICA
        dir3Codi: A04035965
        nom: Joan
        email: persona@correu.es
        documentTipus: PASSAPORT
      properties:
        incapacitat:
          default: false
          description: |-
            Indica si el titular es incapacitat per llegir/rebutjar la notificació.
            En aquest cas, seria obligatori informar un destinatari de l'enviament.
          example: false
          type: boolean
        interessatTipus:
          description: |-
            Enumerat que indica el tipus de l’interessat que realitza l’enviament.
             * En cas d'indicar un interessat tipus FISICA_SENSE_NIF serà obligatori informar el camp documentTipus
          enum:
          - ADMINISTRACIO
          - FISICA
          - JURIDICA
          - FISICA_SENSE_NIF
          example: FISICA
          type: string
        nom:
          description: |-
            Nom del titular.
             * Obligatori en cas de persones físiques
             * Mida màxima de 255 caràcters quan es tracta d'una administració
             * Mida màxima de 30 caràcters per la resta de tipus d'interessats
             * En el cas de persones jurídiques es posarà el nom en el camp raoSocial. En cas de no informar-se el camp raoSocial s'agafarà el valor indicat en aquest camp
          example: Joan
          maxLength: 30
          minLength: 0
          type: string
        llinatge1:
          description: |-
            Primer llinatge de l’interessat
             * Obligatori en cas de persones físiques
          example: Riera
          maxLength: 30
          minLength: 0
          type: string
        llinatge2:
          description: Segon llinatge de l’interessat
          example: Servera
          maxLength: 30
          minLength: 0
          type: string
        documentTipus:
          description: |-
            Enumerat que indica el tipus de document aportat per l’interessat
             * Aquest camp únicament es té en compte quan el tipus d’interessat és FISICA_SENSE_NIF
          enum:
          - PASSAPORT
          - ESTRANGER
          - ALTRE
          example: PASSAPORT
          type: string
        nif:
          description: |-
            Número del document de l'interessat
             * Obligatori excepte per interessats tipus FISICA_SENSE_NIF
          example: 00000000T
          maxLength: 9
          minLength: 0
          type: string
        telefon:
          description: |-
            Telèfon de l’interessat
             * Actualment no s’utilitza
          example: "678123456"
          maxLength: 16
          minLength: 0
          type: string
        email:
          description: "Correu electrònic de l’interessat. \n * Altament recomanat\
            \ el seu ús."
          example: persona@correu.es
          maxLength: 160
          minLength: 0
          type: string
        raoSocial:
          description: |-
            Raó social de l’interessat
             * S’utilitza únicament en cas de persones jurídiques, i si no s’informa aquest camp, s’utilitzarà el valor del camp nom. És obligatori que un dels dos camps estigui informat
          example: Amazon ltd.
          maxLength: 80
          minLength: 0
          type: string
        dir3Codi:
          description: |-
            Codi DIR3 de la administració a la que pertany la persona.
             * Obligatori si s’ha d’enviar a una administració.
          example: A04035965
          maxLength: 9
          minLength: 0
          type: string
      required:
      - dir3Codi
      - interessatTipus
      type: object
