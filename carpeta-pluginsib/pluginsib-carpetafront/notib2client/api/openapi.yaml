    DocumentV2:
      description: |-
        Document que s’envia en la comunicació.
         * Únicament es pot adjuntar més d’un document en cas de comunicacions a la administració (SIR)
      example:
        arxiuNom: document.pdf
        contingutBase64: JVBERi0xLjYKJcOkw7zDtsOfCjIgMCBv==
        csv: aa10b27d8e221cf923715f01e01f515fa7cfec1322b6b49644a27a00461defea
        normalitzat: false
        tipoDocumental: INFORME
        origen: ADMINISTRACIO
        modoFirma: false
        uuid: 00000000-0000-0000-0000-000000000000
        url: http://server_path/document/123456.pdf
        validesa: ORIGINAL
      properties:
        arxiuNom:
          description: Nom de l’arxiu
          example: document.pdf
          maxLength: 200
          minLength: 0
          type: string
        contingutBase64:
          description: |-
            Contingut del document en Base64.
             * Obligatori si no està informat l’enllaç extern, l’uuid o el csv. * Mida màxima 10Mb
          example: JVBERi0xLjYKJcOkw7zDtsOfCjIgMCBv==
          type: string
        uuid:
          description: |-
            Codi uuid que es pot utilitzar per tal d’obtenir el document imprimible del sistema d’arxiu
             * Obligatori si no està informat l’enllaç extern, el contingut en Base64 o el csv.
          example: 00000000-0000-0000-0000-000000000000
          maxLength: 256
          minLength: 0
          type: string
        csv:
          description: |-
            Codi csv que es pot utilitzar per tal d’obtenir el document imprimible del sistema d’arxiu
             * Obligatori si no està informat l’enllaç extern, el contingut en Base64 o l'uuid.
          example: aa10b27d8e221cf923715f01e01f515fa7cfec1322b6b49644a27a00461defea
          maxLength: 256
          minLength: 0
          type: string
        url:
          description: |-
            Enllaç extern on es troba el document de l’enviament.
             * Obligatori si no està informat l’uuid, el contingut en Base64 o el csv. * Sistema actualment NO soportat.
          example: http://server_path/document/123456.pdf
          maxLength: 256
          minLength: 0
          type: string
        normalitzat:
          default: false
          description: "Indica si el document està normalitzat per a la impressió\
            \ al CIE. \n * Només aplica per enviaments postals."
          example: false
          type: boolean
        origen:
          default: ADMINISTRACIO
          description: |-
            Enumerat que indica l’origen del document.
             * No s’utilitza en el cas de documents passats com a csv o uuid
          enum:
          - CIUTADA
          - ADMINISTRACIO
          example: ADMINISTRACIO
          type: string
        tipoDocumental:
          default: NOTIFICACIO
          description: |-
            Enumerat que indica el tipus de document.
             * No s’utilitza en el cas de documents passats com a csv o uuid
          enum:
          - RESSOLUCIO
          - ACORD
          - CONTRACTE
          - CONVENI
          - DECLARACIO
          - COMUNICACIO
          - NOTIFICACIO
          - PUBLICACIO
          - JUSTIFICANT_RECEPCIO
          - ACTA
          - CERTIFICAT
          - DILIGENCIA
          - INFORME
          - SOLICITUD
          - DENUNCIA
          - ALEGACIO
          - RECURS
          - COMUNICACIO_CIUTADA
          - FACTURA
          - ALTRES_INCAUTATS
          - ALTRES
          - LLEI
          - MOCIO
          - INSTRUCCIO
